# Replace `app` after: fly apps create <name>
app = "olle"
primary_region = "arn"

[build]

[env]
  OLLE_PUBLIC = "1"
  OLLE_STATE_PATH = "/data/.olle-state.json"
  OLLE_INBOUND_PORT = "8787"
  OLLE_INBOUND_PATH = "/webhooks/email/inbound"
  OLLE_BIND_HOST = "0.0.0.0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "olle_data"
  destination = "/data"
