# fly.toml app configuration file generated for olle-william on 2026-11-13T12:41:43Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'olle-william'
primary_region = 'ams'

[build]
[env]
  OLLE_BIND_HOST = '0.0.0.0'
  OLLE_INBOUND_PATH = '/webhooks/email/inbound'
  OLLE_INBOUND_PORT = '8787'
  OLLE_PUBLIC = '1'
  OLLE_STATE_PATH = '/data/.olle-state.json'

[[mounts]]
  source = 'olle_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
